<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Checkout Page</title>
</head>

<body>
    <h1>Checkout</h1>
    <section>
        <h2>Your Cart</h2>
        <img src="https://cdn.freecodecamp.org/curriculum/labs/cube.jpg" alt="3D cube.">
    </section>
    <section>
        <h2>Payment Information</h2>
        <form action="#" method="get">
            <label for="card-name">Card Name: </label>
            <input aria-required="true" required type="text" name="card-name" id="card-name">
            <br>
            <label for="card-number">Card Number: </label>
            <input required aria-required="true" type="number" name="card-number" id="card-number">
            <br>
            <button type="submit">Place Order</button>
        </form>
    </section>
</body>

</html>
