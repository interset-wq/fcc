<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form action="#">
            <label for="name">Full Name:</label><br>
            <input type="text" name="name" id="name" placeholder="Enter your name here"><br>
            <label for="email">Email:</label><br>
            <input type="email" name="email" id="email" placeholder="Enter you email here"><br>
            <label for="position">Position:</label><br>
            <select name="position" id="position">
                <option value="none">Selct a position</option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>
            </select>
            <br>
            <fieldset class="radio-group">
                <legend>Availability:</legend>
                <input type="radio" name="availability" id="full-time" value="full-time">
                <label for="full-time">Full-Time</label>
                <input type="radio" name="availability" id="part-time" value="part-time">
                <label for="part-time">Part-Time</label>
            </fieldset>
            <label for="message">Why do you want this job?</label><br>
            <textarea name="message" id="message" placeholder="Write your motivation" rows="4"></textarea><br>
            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
